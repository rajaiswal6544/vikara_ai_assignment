services:
  - type: web
    name: clouddash-support
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DISABLE_RERANKER
        value: "1"
      - key: LOG_LEVEL
        value: INFO
