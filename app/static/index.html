<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudDash Support</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: #e4e4e7;
      --text: #18181b;
      --text-muted: #71717a;
      --agent-bg: #ffffff;
      --user-bg: #18181b;
      --user-text: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --badge-triage: #7c3aed;
      --badge-technical: #0891b2;
      --badge-billing: #059669;
      --badge-escalation: #dc2626;
      --escalated-bg: #fef2f2;
      --escalated-border: #fecaca;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: var(--shadow);
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 18px; height: 18px; fill: #fff; }
    .header-title { font-size: 15px; font-weight: 600; letter-spacing: -.2px; }
    .header-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

    .status-dot {
      width: 8px; height: 8px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-label { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; }

    .btn-new {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: background .15s, border-color .15s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-new:hover { background: var(--bg); border-color: #d1d5db; }
    .btn-new svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      min-height: 0;
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px 20px;
    }
    .empty-icon {
      width: 56px; height: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .empty-icon svg { width: 28px; height: 28px; stroke: var(--text-muted); fill: none; }
    .empty-title { font-size: 16px; font-weight: 600; color: var(--text); }
    .empty-desc { font-size: 13px; color: var(--text-muted); max-width: 320px; line-height: 1.5; }

    /* Suggestion chips */
    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }

    /* ── Message row ── */
    .msg-row { display: flex; flex-direction: column; gap: 4px; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.agent { align-items: flex-start; }

    .msg-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
      padding: 0 4px;
    }

    .agent-badge {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      color: #fff;
    }
    .badge-triage    { background: var(--badge-triage); }
    .badge-technical { background: var(--badge-technical); }
    .badge-billing   { background: var(--badge-billing); }
    .badge-escalation{ background: var(--badge-escalation); }

    .bubble {
      max-width: 85%;
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      box-shadow: var(--shadow);
    }
    .bubble.user {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }
    .bubble.agent {
      background: var(--agent-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .bubble.escalated {
      background: var(--escalated-bg);
      border-color: var(--escalated-border);
    }

    /* Formatted agent text */
    .bubble.agent p { margin-bottom: 8px; }
    .bubble.agent p:last-child { margin-bottom: 0; }
    .bubble.agent strong { font-weight: 600; }
    .bubble.agent ul, .bubble.agent ol { padding-left: 18px; margin-bottom: 8px; }
    .bubble.agent li { margin-bottom: 4px; }
    .bubble.agent code {
      background: #f4f4f5;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }

    /* Escalation banner */
    .escalation-banner {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 500;
      color: #dc2626;
      background: var(--escalated-bg);
      border: 1px solid var(--escalated-border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      max-width: 85%;
    }
    .escalation-banner svg { width: 14px; height: 14px; stroke: currentColor; fill: none; flex-shrink: 0; }

    /* Sources */
    .sources-toggle {
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 4px;
      border-radius: 4px;
      border: none; background: none;
      transition: color .15s;
      margin-top: 2px;
    }
    .sources-toggle:hover { color: var(--accent); }
    .sources-toggle svg { width: 12px; height: 12px; stroke: currentColor; fill: none; transition: transform .2s; }
    .sources-toggle.open svg { transform: rotate(180deg); }

    .sources-list {
      display: none;
      flex-direction: column;
      gap: 4px;
      max-width: 85%;
      margin-top: 2px;
    }
    .sources-list.open { display: flex; }
    .source-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .source-item strong { color: var(--text); font-weight: 500; }

    /* Ticket badge */
    .ticket-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      color: #92400e;
      max-width: 85%;
    }

    /* Typing indicator */
    .typing { display: flex; align-items: center; gap: 4px; padding: 12px 15px; }
    .typing span {
      width: 6px; height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* ── Input area ── */
    .input-area {
      padding: 12px 0 20px;
      flex-shrink: 0;
    }
    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 10px 10px 16px;
      box-shadow: var(--shadow);
      transition: border-color .15s;
    }
    .input-box:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      max-height: 120px;
      font-family: inherit;
      color: var(--text);
      background: transparent;
    }
    #user-input::placeholder { color: #a1a1aa; }

    .send-btn {
      width: 36px; height: 36px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s, transform .1s;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:active { transform: scale(.95); }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; stroke: #fff; fill: none; }

    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
    </div>
    <div>
      <div class="header-title">CloudDash Support</div>
      <div class="header-subtitle">Multi-agent AI assistant</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <span class="status-label"><span class="status-dot"></span>Online</span>
    <button class="btn-new" onclick="newConversation()">
      <svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      New conversation
    </button>
  </div>
</header>

<main>
  <div id="messages">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/></svg>
      </div>
      <div>
        <div class="empty-title">How can we help?</div>
        <div class="empty-desc">Ask about billing, technical issues, account management, or anything CloudDash related.</div>
      </div>
      <div class="suggestions">
        <div class="chip" onclick="fillInput('My alerts stopped firing after I updated my AWS credentials.')">AWS alerts not firing</div>
        <div class="chip" onclick="fillInput('I was charged twice this month and need a refund.')">Double charge refund</div>
        <div class="chip" onclick="fillInput('My Okta SSO login is broken, users cannot sign in.')">SSO login broken</div>
        <div class="chip" onclick="fillInput('Does CloudDash support Datadog integration?')">Datadog integration</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Type your message…"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
      </button>
    </div>
    <div class="input-hint">Enter to send · Shift+Enter for new line</div>
  </div>
</main>

<script>
  const BASE = '';
  let conversationId = null;
  let isWaiting = false;

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const emptyState = document.getElementById('empty-state');

  const BADGE_CLASS = {
    triage: 'badge-triage',
    technical: 'badge-technical',
    billing: 'badge-billing',
    escalation: 'badge-escalation',
  };

  function fillInput(text) {
    inputEl.value = text;
    inputEl.focus();
    autoResize(inputEl);
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function setWaiting(val) {
    isWaiting = val;
    sendBtn.disabled = val;
    inputEl.disabled = val;
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideEmpty() {
    if (emptyState) emptyState.style.display = 'none';
  }

  function newConversation() {
    conversationId = null;
    messagesEl.innerHTML = '';
    messagesEl.appendChild(buildEmptyState());
    inputEl.value = '';
    autoResize(inputEl);
  }

  function buildEmptyState() {
    const div = document.createElement('div');
    div.className = 'empty-state';
    div.id = 'empty-state';
    div.innerHTML = `
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/>
        </svg>
      </div>
      <div>
        <div class="empty-title">How can we help?</div>
        <div class="empty-desc">Ask about billing, technical issues, account management, or anything CloudDash related.</div>
      </div>
      <div class="suggestions">
        <div class="chip" onclick="fillInput('My alerts stopped firing after I updated my AWS credentials.')">AWS alerts not firing</div>
        <div class="chip" onclick="fillInput('I was charged twice this month and need a refund.')">Double charge refund</div>
        <div class="chip" onclick="fillInput('My Okta SSO login is broken, users cannot sign in.')">SSO login broken</div>
        <div class="chip" onclick="fillInput('Does CloudDash support Datadog integration?')">Datadog integration</div>
      </div>
    `;
    return div;
  }

  function appendUserBubble(text) {
    hideEmpty();
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="msg-meta">${formatTime()}</div>
      <div class="bubble user">${escHtml(text)}</div>
    `;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function appendTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="bubble agent" style="padding:12px 15px;">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>
    `;
    messagesEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function appendAgentBubble(data) {
    const row = document.createElement('div');
    row.className = 'msg-row agent';

    const agent = data.agent || 'triage';
    const badgeCls = BADGE_CLASS[agent] || 'badge-triage';
    const escalated = data.escalated;
    const sources = data.sources || [];
    const ticketId = data.ticket_id;

    const sourceId = 'src-' + Math.random().toString(36).slice(2);

    row.innerHTML = `
      <div class="msg-meta">
        <span class="agent-badge ${badgeCls}">${agent}</span>
        ${formatTime()}
      </div>
      <div class="bubble agent ${escalated ? 'escalated' : ''}">${formatMarkdown(data.response || data.message || '')}</div>
      ${escalated ? `
        <div class="escalation-banner">
          <svg viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
          Escalated to human support${ticketId ? ' · Ticket <strong>' + escHtml(ticketId) + '</strong>' : ''}
        </div>
      ` : ''}
      ${!escalated && ticketId ? `<div class="ticket-badge">🎫 Ticket: ${escHtml(ticketId)}</div>` : ''}
      ${sources.length > 0 ? `
        <button class="sources-toggle" onclick="toggleSources('${sourceId}', this)">
          <svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
          ${sources.length} source${sources.length > 1 ? 's' : ''}
        </button>
        <div class="sources-list" id="${sourceId}">
          ${sources.map(s => `
            <div class="source-item">
              <strong>${escHtml(s.section || s.document || 'Source')}</strong>
              ${s.chunk_id ? ` · <code>${escHtml(s.chunk_id)}</code>` : ''}
              ${s.text ? `<div style="margin-top:4px;color:var(--text-muted);font-size:10px;line-height:1.4;">${escHtml(s.text.slice(0, 120))}${s.text.length > 120 ? '…' : ''}</div>` : ''}
            </div>
          `).join('')}
        </div>
      ` : ''}
    `;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function toggleSources(id, btn) {
    const list = document.getElementById(id);
    list.classList.toggle('open');
    btn.classList.toggle('open');
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isWaiting) return;

    inputEl.value = '';
    autoResize(inputEl);
    appendUserBubble(text);
    setWaiting(true);
    const typingRow = appendTyping();

    try {
      let data;

      if (!conversationId) {
        // Start new conversation
        const res = await fetch(`${BASE}/conversations`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initial_message: text }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        data = await res.json();
        conversationId = data.conversation_id;
        // Normalise shape
        data.response = data.message;
        data.agent = 'triage';
      } else {
        // Continue conversation
        const res = await fetch(`${BASE}/conversations/${conversationId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        data = await res.json();
      }

      removeTyping();
      appendAgentBubble(data);
    } catch (err) {
      removeTyping();
      appendErrorBubble(err.message);
    } finally {
      setWaiting(false);
      inputEl.focus();
    }
  }

  function appendErrorBubble(msg) {
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.innerHTML = `
      <div class="bubble agent" style="border-color:#fecaca;background:#fef2f2;color:#dc2626;">
        Connection error: ${escHtml(msg)}. Please check the server is running.
      </div>
    `;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function formatTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatMarkdown(text) {
    // Escape HTML first
    let s = escHtml(text);
    // Bold **text**
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Inline code `code`
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Numbered list
    s = s.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
    if (s.includes('<li>')) s = '<ol>' + s + '</ol>';
    // Bullet list
    s = s.replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>');
    // Wrap paragraphs (double newline)
    s = s.split(/\n\n+/).map(p => {
      p = p.trim();
      if (!p) return '';
      if (p.startsWith('<ol>') || p.startsWith('<ul>') || p.startsWith('<li>')) return p;
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('');
    return s;
  }
</script>
